name: Build Cursor Halo exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check embedded C#
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $t = Get-Content CursorHalo.ps1 -Raw
          $m = [regex]::Match($t, '(?s)-TypeDefinition @"\r?\n(.*?)\r?\n"@')
          Add-Type -ReferencedAssemblies System.Windows.Forms,System.Drawing -TypeDefinition $m.Groups[1].Value
          $tk = $null; $e = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/CursorHalo.ps1",[ref]$tk,[ref]$e)
          if ($e) { $e; exit 1 }
          Write-Host 'C# and PowerShell syntax OK'
      - name: Build exe
        shell: powershell
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force
          Invoke-ps2exe -inputFile CursorHalo.ps1 -outputFile CursorHalo.exe -noConsole -STA -iconFile assets/icon.ico -title 'Cursor Halo' -version 1.0.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: CursorHalo
          path: CursorHalo.exe
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CursorHalo.exe --target "$GITHUB_SHA" --title 'Cursor Halo (latest)' --notes 'Download CursorHalo.exe and double-click to run.'
